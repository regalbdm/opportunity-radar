name: Xeveza Extended Sources

on:
  workflow_dispatch:

  schedule:
    # Remotive: setiap 6 jam
    - cron: "15 */6 * * *"

    # Himalayas: 1x sehari
    # 01:30 UTC = 08:30 WIB
    - cron: "30 1 * * *"

concurrency:
  group: xeveza-opportunity-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect Remotive
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 */6 * * *'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node ./scripts/collect-remotive.mjs

      - name: Collect Himalayas
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node ./scripts/collect-himalayas.mjs

      - name: DeepSeek enrichment
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node ./scripts/enrich-deepseek.mjs

      - name: Quality check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node ./scripts/quality-check.mjs